name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  make:
    name: Build Sileobtainium
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Le sous-module DepictionKit n'est pas dans le repo (vide quand on
      # upload depuis le zip), donc on le clone à la main.
      - name: Fetch DepictionKit
        run: |
          rm -rf Deps/DepictionKit
          git clone --recursive https://github.com/RepositoryStandards/DepictionKit.git Deps/DepictionKit

      - name: Install tools
        run: brew install ldid dpkg xz

      - name: Build (iphoneos-arm, rootful)
        run: make clean package NIGHTLY=1 DEBUG=0 ALL_BOOTSTRAPS=1

      - name: Build (iphoneos-arm64, rootless)
        run: make clean package NIGHTLY=1 DEBUG=0 ALL_BOOTSTRAPS=1 SILEO_PLATFORM=iphoneos-arm64

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: Sileobtainium-debs
          path: packages/*.deb
