name: Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make:
    name: Build Sileobtainium
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Le sous-module DepictionKit n'est pas dans le repo (vide quand on
      # upload depuis le zip), donc on le clone à la main.
      - name: Fetch DepictionKit
        run: |
          rm -rf Deps/DepictionKit
          git clone --recursive https://github.com/RepositoryStandards/DepictionKit.git Deps/DepictionKit

      - name: Install tools
        run: brew install ldid dpkg xz

      # 1) Evander (dépendance) demande iOS 12 minimum, le projet vise iOS 11 :
      #    Xcode 26 refuse, on passe la cible à 12.0.
      # 2) L'analyseur statique de Clang plante sur dpkgversion.c avec Xcode 26
      #    (et ne sert à rien pour un .deb), on le désactive.
      - name: Patch project
        run: |
          sed -i '' \
            -e 's/IPHONEOS_DEPLOYMENT_TARGET = 11.0;/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/' \
            -e 's/RUN_CLANG_STATIC_ANALYZER = YES;/RUN_CLANG_STATIC_ANALYZER = NO;/' \
            Sileo.xcodeproj/project.pbxproj
          grep -c "IPHONEOS_DEPLOYMENT_TARGET = 12.0;" Sileo.xcodeproj/project.pbxproj
          grep -c "RUN_CLANG_STATIC_ANALYZER = NO;" Sileo.xcodeproj/project.pbxproj

      # Alderis (color picker) déclare une propriété `tab` qui entre en conflit
      # avec UIViewController.tab ajouté dans le SDK iOS 18. On la renomme dans
      # les sources téléchargées par SwiftPM avant de compiler.
      - name: Build (rootful + rootless)
        run: |
          build() {
            make clean
            xcodebuild -resolvePackageDependencies -project Sileo.xcodeproj -scheme Sileo -derivedDataPath "$TMPDIR/sileo"
            F="$TMPDIR/sileo/SourcePackages/checkouts/Alderis/Alderis/ColorPickerInnerViewController.swift"
            sed -i '' 's/var tab: ColorPickerTab {/var pickerTab: ColorPickerTab {/' "$F"
            sed -i '' 's/^\([[:space:]]*\)tab = configuration.initialTab/\1pickerTab = configuration.initialTab/' "$F"
            grep -n "pickerTab" "$F"
            make package NIGHTLY=1 DEBUG=0 ALL_BOOTSTRAPS=1 "$@"
          }
          build
          build SILEO_PLATFORM=iphoneos-arm64
          ls -l packages

      # main -> release "nightly", autres branches -> artifact
      - name: Upload artifact
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Sileobtainium-debs
          path: packages/*.deb

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="nightly"
          notes=$(printf 'Rootless (Dopamine, palera1n): %s\nRootful: %s\n\nBuild %s' \
            "$(cd packages && ls *_iphoneos-arm64.deb)" \
            "$(cd packages && ls *_iphoneos-arm.deb)" \
            "${GITHUB_SHA::7}")
          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/$tag"
          if gh release view "$tag" > /dev/null 2>&1; then
            for a in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$tag" "$a" --yes
            done
            gh release upload "$tag" packages/*.deb --clobber
            gh release edit "$tag" --title "Sileobtainium nightly" --notes "$notes" --latest
          else
            gh release create "$tag" packages/*.deb --title "Sileobtainium nightly" --notes "$notes" --latest
          fi
